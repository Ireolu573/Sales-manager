name: Frontend validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [uiux/figma-complete-replica]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
